<form method="post" action="{% url "create_scale" exam_pk %}">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <div class="row g-3">
        <div class="col-12">{{ form.name.as_field_group }}</div>
        <div class="col-sm-6">{{ form.total_points.as_field_group }}</div>
        <div class="col-sm-6">{{ form.points_to_add.as_field_group }}</div>
        <div class="col-sm-4">{{ form.min_grade.as_field_group }}</div>
        <div class="col-sm-4">{{ form.max_grade.as_field_group }}</div>
        <div class="col-sm-4">{{ form.rounding.as_field_group }}</div>
    </div>
</form>
