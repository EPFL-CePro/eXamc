<form id="print-settings-form" method="post" action="{% url 'prep_print_settings' exam_selected.pk %}">
    {% csrf_token %}
    {% csrf_token %}

    <p class="mb-2"><strong>Print format</strong></p>

    <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="print_format" id="print-format-standard" value="standard"
               {% if exam_selected.print_format != "booklet" %}checked{% endif %}>
        <label class="form-check-label" for="print-format-standard">
            Standard
            <span class="d-block text-muted small">Any number of pages per copy.</span>
        </label>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="radio" name="print_format" id="print-format-booklet" value="booklet"
               {% if exam_selected.print_format == "booklet" %}checked{% endif %}>
        <label class="form-check-label" for="print-format-booklet">
            Booklet
            <span class="d-block text-muted small">
                A3 folded and stapled in the middle: the number of pages per copy is a multiple of 4.
                Blank pages are added at the end of each copy if needed (final generation).
            </span>
        </label>
    </div>

    <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-dark">Save</button>
    </div>
</form>
{% if oob %}{% include "exam/preparation/partials/_prep_print_badge.html" %}{% endif %}
