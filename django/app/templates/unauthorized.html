{% extends 'base.html' %}

{% block title %}Welcome!{% endblock %}

{% block content %}
    <div class="position-fixed top-0 start-0 w-100 h-100 overflow-auto bg-dark bg-gradient
                d-flex align-items-center justify-content-center p-3 z-3"
         data-bs-theme="dark">

        <main class="card border-0 shadow-lg w-100" style="max-width: 26rem">
            <div class="card-body p-5 p-sm-5 text-center">
                <img src="{% get_logo_url %}" alt="eXamc" class="img-fluid rounded mb-4" style="width: 17rem">

                <h1 class="h4 mb-1">Welcome</h1>
                <p class="text-body-secondary mb-4">Please sign in to continue:</p>

                <a class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center gap-2"
                   href="{% url 'oidc_authentication_init' %}{% if next %}?next={{ next|urlencode }}{% endif %}">
                    <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
                    Sign in with EPFL (Entra ID)
                </a>

                <div class="d-flex align-items-center gap-3 my-4 text-body-secondary small">
                    <hr class="flex-grow-1 m-0">
                    or
                    <hr class="flex-grow-1 m-0">
                </div>

                <div class="d-flex flex-column gap-2">
                    <a class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2"
                       href="{% url 'generate_room_plan' %}">
                        <i class="fa-solid fa-chair" aria-hidden="true"></i> Generate a room plan</a>

                    <a class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2"
                       href="{% url 'csvgen' %}">
                        <i class="fa-solid fa-file-csv"></i> Generate student list CSV</a>
                </div>
            </div>
        </main>
    </div>
{% endblock %}
