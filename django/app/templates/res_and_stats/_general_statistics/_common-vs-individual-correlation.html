<button type="button"
        onclick="downloadElementAsPDF({
            title:'Common vs individual statistics correlation',
            subtitle:'{{ exam_selected.code }} - {{ exam_selected.date|date:'Y-m-d' }}',
            elementId:'comVsInd_correlation_div',
            fileName:'{{ exam_selected.code }}_{{ exam_selected.date|date:'Y-m-d' }}_comVsInd_correlation_statistics.pdf'});
        "
        class="btn btn-primary mb-3">
    <i class="fas fa-file-pdf"></i> Download as PDF
</button>

<div class="table-responsive" id="comVsInd_correlation_div">
    <table id="byExam_comVsInd_correlation_dt" class="table table-striped table-sm">
        <tbody>
        {% for corr in correlation_list %}
            <tr>
                <th colspan="2">{{ corr.0.code }}</th>
            </tr>
            <tr>
                <td class="w-50 p-4">
                    <table class="table table-borderless mb-0">
                        <tbody>
                        <tr>
                            <td>Correlation coefficient (r)</td>
                            <td>{{ corr.1 }}</td>
                        </tr>
                        <tr>
                            <td>Sample size (n)</td>
                            <td>{{ corr.4|length }}</td>
                        </tr>
                        <tr>
                            <td>T-score (t)</td>
                            <td>{{ corr.2 }}</td>
                        </tr>
                        <tr>
                            <td>P-value</td>
                            <td>{{ corr.3 }}</td>
                        </tr>
                        </tbody>
                    </table>
                </td>
                <td>
                    <div class="chart-container mx-auto" style="width:80%">
                        <canvas id="canvas_correlation_{{ corr.0.pk }}" class="chartjs-render-monitor"></canvas>
                    </div>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
