{% extends 'base.html' %}

{% block title %}Search people{% endblock %}

{% block content %}
    <h1>Search people</h1>
    {% alert "info" fit=True %}
        The first column of the Excel file must contain SCIPERs, emails or usernames. They can be mixed
    {% endalert %}

    <form method="post" enctype="multipart/form-data" style="max-width: var(--form-max-width)">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="btn btn-primary">Upload</button>
    </form>
{% endblock %}
