repo_url: "https://github.com/EPFL-CePro/eXamc.git"
repo_version: "staging" # TODO change to main when ready

env_name: "prod"
app_dir: "/opt/examc"
compose_profiles: ""
compose_file: "prod.yml"
compose_project_name: "examc"

debug: false
secure_ssl_redirect: true
session_cookie_secure: true
csrf_cookie_secure: true
use_ssl: true

allowed_hosts:
  - "examc.epfl.ch"
  - "localhost"
  - "127.0.0.1"

csrf_trusted_origins:
  - "https://examc.epfl.ch"

tz: "Europe/Zurich"
private_media_root: "/private_media"

db_host: "172.17.0.1" # IP of the host server in the Docker network
db_port: 3306

celery_broker_url: "redis://redis:6379/0"
celery_result_backend: "redis://redis:6379/0"
celery_task_always_eager: false

constance_redis_connection: "redis://redis:6379/0"

django_cache_url: "redis://redis:6379/1"
django_maintenance_cache_url: "redis://redis:6379/2"
