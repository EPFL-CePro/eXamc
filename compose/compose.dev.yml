name: examc-dev

services:
  caddy:
    extends:
      service: caddy
      file: compose.base.yml
    ports:
      - "127.0.0.1:${CADDY_PORT:-8443}:${CADDY_PORT:-8443}"

  mysql:
    extends:
      service: mysql
      file: compose.base.yml
    ports:
      - ${DB_PORT:-3307}:3306 # used for local client
    env_file:
      - ../.env.dev
    volumes:
      - ./deploy/db/dev-seed.sql.gz:/docker-entrypoint-initdb.d/20-seed.sql.gz:ro

  redis:
    extends:
      service: redis
      file: compose.base.yml

  fe-runner:
    build:
      context: ../frontend
      target: dev
    volumes:
      - ../frontend/app/:/app/frontend:z
    ports:
      - "127.0.0.1:5173:5173"

  django:
    extends:
      service: django
      file: compose.base.yml
    build:
      context: ../django
      target: dev
    environment:
      DEBUG: "1"
      VITE_DEV_MODE: "1"
      COLLECTSTATIC: "0" # in dev, OK
    volumes:
      - ../django/app/:/app:z
      - ./data/private_media:/private_media
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000", "--nothreading"]
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../.env.dev

  docs:
    extends:
      service: django
    environment:
      WEB_CONCURRENCY: "1"
    entrypoint: ["python", "/opt/sphinx-autobuild.py"]
    ports:
      - "127.0.0.1:9000:9000"

  celery:
    extends:
      service: celery
      file: compose.base.yml
    build:
      context: ../django
      target: tooling
    volumes:
      - ../django/app/:/app:z
      - ./data/private_media:/private_media
    env_file:
      - ../.env.dev

  celery_beat:
    extends:
      service: celery_beat
      file: compose.base.yml
    build:
      context: ../django
      target: tooling
    volumes:
      - ../django/app/:/app:z
      - ./data/private_media:/private_media
    env_file:
      - ../.env.dev

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
  static_volume:

secrets:
  secret_key: { file: "${SECRETS_DIR:-./secrets}/secret_key" }
  mysql_root_password: { file: "${SECRETS_DIR:-./secrets}/mysql_root_password" }
  mysql_password: { file: "${SECRETS_DIR:-./secrets}/mysql_password" }
  redis_password: { file: "${SECRETS_DIR:-./secrets}/redis_password" }
  redis_acl: { file: "${SECRETS_DIR:-./secrets}/redis_acl" }
  oidc_rp_client_id: { file: "${SECRETS_DIR:?set SECRETS_DIR}/oidc_rp_client_id" }
  oidc_rp_client_secret: { file: "${SECRETS_DIR:?set SECRETS_DIR}/oidc_rp_client_secret" }
  tenant_id: { file: "${SECRETS_DIR:?set SECRETS_DIR}/tenant_id" }
  oasis_base_url: { file: "${SECRETS_DIR:?set SECRETS_DIR}/oasis_base_url" }
  oasis_bearer: { file: "${SECRETS_DIR:?set SECRETS_DIR}/oasis_bearer" }