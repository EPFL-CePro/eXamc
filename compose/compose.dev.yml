name: examc-dev

# Dev stack. Variables come from the .env rendered by Ansible (passed with --env-file):
# SECRETS_DIR, PRIVATE_MEDIA_DIR, SITE_ADDRESS, CADDY_PORT, DEBUG, ...

services:
  caddy:
    extends:
      service: caddy
      file: compose.base.yml
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports:
      - "127.0.0.1:${CADDY_PORT:-8443}:${CADDY_PORT:-8443}"

  mysql:
    extends:
      service: mysql
      file: compose.base.yml
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"   # for a local SQL client

  # Creates the database and app user; loads the dev seed into an empty database
  mysql-init:
    extends:
      service: mysql-init
      file: compose.base.yml
    volumes:
      - ./deploy/db/dev-seed.sql.gz:/seed/dev-seed.sql.gz:ro

  redis:
    extends:
      service: redis
      file: compose.base.yml

  fe-runner:
    build:
      context: ../frontend
      target: dev
    volumes:
      - ../frontend/app/:/app/frontend:z
    ports:
      - "127.0.0.1:5173:5173"

  django:
    extends:
      service: django
      file: compose.base.yml
    build:
      context: ../django
      target: dev
    environment:
      VITE_DEV_MODE: "1"
      COLLECTSTATIC: "0"
    volumes:
      - ../django/app/:/app:z
      - ${PRIVATE_MEDIA_DIR:-./data/private_media}:/private_media
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      redis:
        condition: service_healthy

  docs:
    extends:
      service: django
    environment:
      WEB_CONCURRENCY: "1"
    entrypoint: ["python", "/opt/sphinx-autobuild.py"]
    ports:
      - "127.0.0.1:9000:9000"

  celery:
    extends:
      service: celery
      file: compose.base.yml
    build:
      context: ../django
      target: tooling
    volumes:
      - ../django/app/:/app:z
      - ${PRIVATE_MEDIA_DIR:-./data/private_media}:/private_media

  celery_beat:
    extends:
      service: celery_beat
      file: compose.base.yml
    build:
      context: ../django
      target: tooling
    volumes:
      - ../django/app/:/app:z
      - ${PRIVATE_MEDIA_DIR:-./data/private_media}:/private_media

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
  static_volume:

secrets:
  secret_key:            { file: "${SECRETS_DIR:-./secrets}/secret_key" }
  mysql_root_password:   { file: "${SECRETS_DIR:-./secrets}/mysql_root_password" }
  mysql_password:        { file: "${SECRETS_DIR:-./secrets}/mysql_password" }
  redis_password:        { file: "${SECRETS_DIR:-./secrets}/redis_password" }
  redis_acl:             { file: "${SECRETS_DIR:-./secrets}/redis_acl" }
  oidc_rp_client_id:     { file: "${SECRETS_DIR:-./secrets}/oidc_rp_client_id" }
  oidc_rp_client_secret: { file: "${SECRETS_DIR:-./secrets}/oidc_rp_client_secret" }
  tenant_id:             { file: "${SECRETS_DIR:-./secrets}/tenant_id" }
  oasis_base_url:        { file: "${SECRETS_DIR:-./secrets}/oasis_base_url" }
  oasis_bearer:          { file: "${SECRETS_DIR:-./secrets}/oasis_bearer" }
  tls_crt:               { file: "${SECRETS_DIR:-./secrets}/tls_crt" }
  tls_key:               { file: "${SECRETS_DIR:-./secrets}/tls_key" }