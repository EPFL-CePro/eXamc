name: examc-test

services:
  mysql:
    extends:
      service: mysql
      file: base.yml
    volumes:
      # This lets the test user create a DB for testing
      - ./deploy/db/init-test-user.sql:/docker-entrypoint-initdb.d/test-user.sql:ro

  redis:
    extends:
      service: redis
      file: base.yml

  fe-artifacts:
    build:
      context: ../frontend
      target: artifact
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../frontend/app/:/app/frontend:z
      - static_volume:/static
    restart: "no"

  django:
    extends:
      service: django
      file: base.yml
    build:
      context: ../django
      target: tooling
    command: ["pytest"]
    environment:
      TESTING_MODE_ENABLED: "1"
      DJANGO_SETTINGS_MODULE: "examc.settings"
    depends_on:
      fe-artifacts:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      - ../django/app/:/app:z
    restart: no

volumes:
  mysql_data:
  redis_data:
  static_volume:
