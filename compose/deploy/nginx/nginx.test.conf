events {}
http {

  # Let REALLY big bodies through globally (can also place in server/location)
  client_max_body_size 15g;

  # Where to store temp bodies (mount this as a volume with lots of space)
  client_body_temp_path /var/cache/nginx/client_temp 1 2;

  # Conservative timeouts for slow/big uploads
  client_body_timeout 3600s;
  send_timeout        3600s;

  # Apache managing tls with redirect
  server {
    # no HTTPS redirect here
    listen 80;
    server_name _;

    # Apache already did HTTPS; tell Django the original scheme
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://django:8000;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      # Stream uploads to the upstream instead of buffering to disk
      proxy_request_buffering off;
    }

    location ^~ /static/ {
      alias /static/;
      access_log off;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    location ^~ /media/ {
      alias /media/;
      expires 7d;
      try_files $uri =404;
    }

    location ^~ /rooms_plans/ {
      alias /private_media/rooms_plans/;  # nginx sees files here
      access_log off;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
  }

    location /healthz { return 200 "ok"; }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 10g;
  }
}
