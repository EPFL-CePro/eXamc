# examc/deploy/nginx/nginx.dev.conf
events {}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  # Docker internal DNS
  resolver 127.0.0.11 ipv6=off;

  server {
    listen 80;
    client_max_body_size 50m;

    # Upstreams stored in variables => re-resolved at runtime
    set $upstream "django:8000";
    set $docs_upstream "docs:9000";

    location /static/ { alias /static/; access_log off; expires 7d; }
    location /media/  { alias /media/;  expires 7d; }

    # Live documentation (sphinx-autobuild) instead of the pre-built docs
    location = /documentation { return 301 /documentation/; }

    location /documentation/ {
      # proxy_pass with a variable => strip the prefix ourselves
      rewrite ^/documentation/(.*)$ /$1 break;
      proxy_pass http://$docs_upstream;
      # sphinx-autobuild redirects (/dir -> /dir/) drop the prefix, so add it back
      proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/documentation/$2;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # No caching: always serve the latest build
      add_header Cache-Control "no-store";
    }

    location / {
      proxy_pass http://$upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Private files: served by nginx after Django authorization
    location /_protected/ {
        internal;                 # never directly accessible
        alias /private_media/;    # matches the mount in the nginx container
        # (optional) add_header Content-Disposition 'attachment';  # force download
    }

    location /healthz { return 200 "ok"; }
  }
}