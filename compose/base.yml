name: examc

services:
  mysql:
    image: mysql:8.4
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER:-root} -p$${MYSQL_PASSWORD:-$${MYSQL_ROOT_PASSWORD:-}} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    depends_on:
      web:
        condition: service_started
    volumes:
      - media_volume:/media:ro
      - static_volume:/static:ro
      # configuration and private_media are mounted in dev.yml
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ..
    environment:
      # Attente DB (entrypoint sait gérer ces vars)
      WAIT_FOR_DB: "1"
      WAIT_FOR_DB_TIMEOUT: "600"

      # Gunicorn
      WEB_CONCURRENCY: "6"
      GUNICORN_THREADS: "4"
      GUNICORN_WORKER_CLASS: "gthread"

      # Toujours définir explicitement l’hôte/port DB vus par les conteneurs
      # DB_HOST: ${DB_HOST}
      # DB_PORT: ${DB_PORT}
    depends_on:
      redis:
        condition: service_started
    volumes:
      - media_volume:/media
      - static_volume:/static # collectstatic writes hashed assets here
      # /app is only mounted in dev.yml
      # /private_media is mounted in dev.yml and prod.yml
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  celery:
    extends:
      service: web
    environment:
      CELERY_LOGLEVEL: "INFO"
      CELERY_CONCURRENCY: "4"
    command: celery -A examc worker --loglevel=INFO --pidfile=/tmp/celery.pid
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery.pid && kill -0 $(cat /tmp/celery.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_beat:
    extends:
      service: web
    environment:
      CELERY_LOGLEVEL: "INFO"
    command: >
      celery -A examc beat --loglevel=INFO
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
        --pidfile=/tmp/celerybeat.pid
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  client_temp:
