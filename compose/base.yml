name: examc

services:
  mysql:
    image: mysql:8.4
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-examc}
      MYSQL_USER: ${MYSQL_USER:-examc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER:-root} -p$${MYSQL_PASSWORD:-$${MYSQL_ROOT_PASSWORD:-}} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    depends_on:
      django:
        condition: service_started
    volumes:
      - media_volume:/media:ro
      - static_volume:/static:ro
      # configuration and private_media are mounted in dev.yml
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  django:
    environment:
      # TODO - use secrets instead of env vars for secrets for better security
      # See https://docs.docker.com/compose/how-tos/use-secrets/

      ENV: "${ENV:-prod}"

      # Wait on DB to be ready (managed by entrypoint.sh)
      # This is used instead of health check to support DB server out of docker
      WAIT_FOR_DB: "1"
      WAIT_FOR_DB_TIMEOUT: "600"

      # Django
      SECRET_KEY: "${SECRET_KEY:-}"
      DEBUG: "${DEBUG:-0}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-1}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-1}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-1}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8000,http://127.0.0.1:8000}"
      TZ: "${TZ:-Europe/Zurich}"
      PRIVATE_MEDIA_ROOT: "${PRIVATE_MEDIA_ROOT:-/private_media}"

      # Gunicorn
      WEB_CONCURRENCY: "6"
      GUNICORN_THREADS: "4"
      GUNICORN_WORKER_CLASS: "gthread"

      # MySQL - always define explicitly DB's host and port seen by the containers
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-examc}"
      MYSQL_USER: "${MYSQL_USER:-examc}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"

      # Redis
      CONSTANCE_REDIS_CONNECTION: "${CONSTANCE_REDIS_CONNECTION:-redis://redis:6479/0}"

      # Mozilla OIDC Entra ID
      OIDC_RP_CLIENT_ID: "${OIDC_RP_CLIENT_ID}"
      OIDC_RP_CLIENT_SECRET: "${OIDC_RP_CLIENT_SECRET}"
      TENANT_ID: "${TENANT_ID}"

      # Oasis API EPFL
      OASIS_BEARER: "${OASIS_BEARER}"
      OASIS_BASE_URL: "${OASIS_BASE_URL}"

      # Celery settings
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/0}"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/0}"
      CELERY_TASK_ALWAYS_EAGER: "${CELERY_TASK_ALWAYS_EAGER:-False}"

      # Exam permission groups
      EXAM_PERMISSION_MANAGE_GROUP_NAMES: "${EXAM_PERMISSION_MANAGE_GROUP_NAMES:-Teacher,Assistant}"
      EXAM_PERMISSION_REVIEW_GROUP_NAMES: "${EXAM_PERMISSION_REVIEW_GROUP_NAMES:-Teacher,Reviewer,Assistant}"
      EXAM_PERMISSION_SEE_RESULTS_GROUP_NAMES: "${EXAM_PERMISSION_SEE_RESULTS_GROUP_NAMES:-Teacher,Assistant,Results,Statistics}"
      COMMON_EXAM_GROUP_NAMES: "${COMMON_EXAM_GROUP_NAMES:-Teacher,Results,Statistics}"
      EXAM_REVIEWER_GROUP_NAMES: "${EXAM_REVIEWER_GROUP_NAMES:-Reviewer}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/media
      - static_volume:/static # collectstatic writes hashed assets here
      # ../django/app is only mounted in dev.yml
      # /private_media is mounted in dev.yml and prod.yml
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  celery:
    extends:
      service: django
    environment:
      CELERY_LOGLEVEL: "INFO"
      CELERY_CONCURRENCY: "4"
    command: celery -A examc worker --loglevel=INFO --pidfile=/tmp/celery.pid
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery.pid && kill -0 $(cat /tmp/celery.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_beat:
    extends:
      service: django
    environment:
      CELERY_LOGLEVEL: "INFO"
    command: >
      celery -A examc beat --loglevel=INFO
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
        --pidfile=/tmp/celerybeat.pid
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  client_temp:
