name: examc-test

services:
  fe-artifacts:
    build:
      context: ../frontend
      target: artifact
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../frontend/app/:/app/frontend:z
      - static_volume:/static
    restart: "no"

  django:
    extends:
      service: django
      file: compose.base.yml
    build:
      context: ../django
      target: tooling
    command: ["pytest"]
    environment:
      TESTING_MODE_ENABLED: "1"
      DJANGO_SETTINGS_MODULE: "examc.settings"
    depends_on:
      fe-artifacts:
        condition: service_completed_successfully
    volumes:
      - ../django/app/:/app:z
    restart: no

volumes:
  static_volume:
