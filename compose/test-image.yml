name: examc-test

services:
  fe-artifacts:
    image: ${FE_ARTIFACTS_IMAGE:-ghcr.io/epfl-cepro/examc-fe-artifacts}:${FE_ARTIFACTS_IMAGE_TAG:-stable}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - static_volume:/static
    restart: "no"

  django:
    extends:
      service: django
      file: base.yml
    image: "${TEST_IMAGE:-localhost/examc-django-test}:${IMAGE_TAG_DJANGO:-latest}"
    command: ["pytest"]
    environment:
      TESTING_MODE_ENABLED: "1"
      DJANGO_SETTINGS_MODULE: "examc.settings"
    depends_on:
      fe-artifacts:
        condition: service_completed_successfully
    volumes:
      - ../django/app:/app
    restart: no

volumes:
  static_volume:
