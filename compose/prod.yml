services:
  nginx:
    volumes:
      - /srv/examc/certs/:/etc/nginx/certs:ro  # certs
      - ../deploy/nginx/nginx.ssl.test.conf:/etc/nginx/nginx.conf:ro
      - /srv/examc/private_media:/private_media:ro
      - client_temp:/var/cache/nginx/client_temp
    ports:
      - "127.0.0.1:8080:80"
      #- "8443:443"

  web:
    user: "1000:2770"
    environment:
      WEB_CONCURRENCY: "6"
      GUNICORN_THREADS: "4"
      GUNICORN_WORKER_CLASS: "gthread"
    volumes:
      - media_volume:/media:ro # TODO figure out if ro should be put or not here
      - /srv/examc/private_media:/private_media:rw
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: examc.epfl.ch' http://127.0.0.1:8000/healthz/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  celery:
    environment:
      CELERY_LOGLEVEL: "INFO"
      CELERY_CONCURRENCY: "4"
    volumes:
      - /srv/examc/private_media:/private_media:rw

  celery_beat:
    environment:
      CELERY_LOGLEVEL: "INFO"
    volumes:
      - /srv/examc/private_media:/private_media:rw
