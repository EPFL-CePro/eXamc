services:
  mysql:
    extends:
      service: mysql
      file: base.yml
    env_file:
      - ../.env.prod

  redis:
    extends:
      service: redis
      file: base.yml

  nginx:
    extends:
      service: nginx
      file: base.yml
    volumes:
      - ./deploy/nginx/nginx.ssl.prod.conf:/etc/nginx/nginx.conf:ro # TODO - check if this is the right file (was test before ?)
      - ./data/certs/:/etc/nginx/certs:ro  # certs
      - ./data/private_media:/private_media:ro
      - client_temp:/var/cache/nginx/client_temp # see ./deploy/nginx/nginx.ssl.prod.conf:8 for usage
    ports:
      - "127.0.0.1:8080:80"
      #- "8443:443"

  fe-builder:
    build:
      context: ../frontend
      target: artifact
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - static_volume:/static
    restart: "no"

  django:
    extends:
      service: django
      file: base.yml
    build:
      target: production
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data/private_media:/private_media
      - media_volume:/media:ro # TODO figure out if ro should be put or not here, or be put in every django service
    depends_on:
      fe-builder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ../.env.prod

  celery:
    extends:
      service: celery
      file: base.yml
    volumes:
      - ./data/private_media:/private_media
    env_file:
      - ../.env.prod

  celery_beat:
    extends:
      service: celery_beat
      file: base.yml
    volumes:
      - ./data/private_media:/private_media
    env_file:
      - ../.env.prod

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  client_temp:
