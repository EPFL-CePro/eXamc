name: Build and Push Image to GHCR, with testing

on:
  workflow_call:
  push:
    branches:
      - a-zurcher
    # TODO: replace by on push tags when ready
    # tags:
    #   - "v**"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image name
        # Required to set an image name in lower-case only
        run: |
          echo "BASE_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('app/pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if container image already exists
        run: |
          TAG="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.BASE_IMAGE_NAME }}:$TAG"

          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists - stopping workflow"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build production target once and load into the local Docker daemon.
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          load: true
          push: false
          platforms: linux/amd64
          tags: |
            ${{ env.BASE_IMAGE_NAME }}:latest
            ${{ env.BASE_IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build the test target locally, as it uses production as a base, building image is not done in parallel
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          push: false
          platforms: linux/amd64
          tags: |
            ${{ env.BASE_IMAGE_NAME }}-test:latest
            ${{ env.BASE_IMAGE_NAME }}-test:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker compose -f compose/test.yml run web

      # Push exactly the images that were tested.
      - name: Push production image
        if: success()
        run: |
          docker push "${{ env.BASE_IMAGE_NAME }}:latest"
          docker push "${{ env.BASE_IMAGE_NAME }}:${{ steps.version.outputs.version }}"

      - name: Docker cleanup
        if: always()
        run: docker compose -f compose/test.yml down -v --remove-orphans || true