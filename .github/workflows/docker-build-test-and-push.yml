name: Build and Push Image to GHCR, with testing

on:
  workflow_call:
  push:
    branches:
      - staging
      - a-zurcher # TODO: replace all "a-zurcher" branch mentions with "main" once merged

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: django
            context: ./django
            target: production
            test_target: tooling
            run_tests: true
          - name: fe-artifacts
            context: ./frontend
            target: artifact
            test_target: ""
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Set image tag
        # Release branch (a-zurcher/main): use the version in app/pyproject.toml to tag the image
        # Staging branch (staging): use the commit SHA to tag the image
        run: |
          if [ "${GITHUB_REF_NAME}" = "a-zurcher" ]; then
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('django/app/pyproject.toml', 'rb'))['project']['version'])")
            echo "IMAGE_TAG=$VERSION" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "IMAGE_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if stable image already exists
        # Skipped on staging branch, as the git commit SHA is used to tag the image
        if: github.ref_name == 'a-zurcher'
        id: check
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::warning::Image $IMAGE already exists — skipping build and push"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      # Build the target image once and load it into the local Docker daemon.
      # This is the image that will be tested (if applicable) and pushed if all tests succeed.
      - name: Build image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build the test target, if this matrix entry has one.
      # It shares the runtime base and dependencies with the production target and is used to run tests.
      - name: Build test image
        if: steps.check.outputs.skip != 'true' && matrix.run_tests
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.test_target }}
          load: true
          push: false
          platforms: linux/amd64
          #    "image.name": "ghcr.io/epfl-cepro/examc-django-test:1.2.0"
          tags: localhost/examc-${{ matrix.name }}-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        if: steps.check.outputs.skip != 'true' && matrix.run_tests
        env:
          TEST_IMAGE: localhost/examc-${{ matrix.name }}-test
          IMAGE_TAG: latest
        run: |
          docker compose -f compose/test.yml --env-file .env.test run --rm django

      # Push only after tests pass (or immediately, for entries with no tests).
      - name: Push staging image
        if: steps.check.outputs.skip != 'true' && github.ref_name == 'staging' && success()
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker tag \
            "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.IMAGE_NAME }}:staging"
          docker push "${{ env.IMAGE_NAME }}:staging"

      - name: Push stable image
        if: steps.check.outputs.skip != 'true' && github.ref_name == 'a-zurcher' && success()
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker tag \
            "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.IMAGE_NAME }}:stable"
          docker push "${{ env.IMAGE_NAME }}:stable"

      - name: Docker cleanup
        if: always() && matrix.run_tests
        run: docker compose -f compose/test.yml down -v --remove-orphans || true