name: Build and Push Image to GHCR, with testing

on:
  workflow_call:
  push:
    branches:
      - staging
      - a-zurcher # TODO: replace by all "a-zurcher" branch mention by "main" once merged

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  docker-build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image name
        # Required to set an image name in lower-case only
        run: |
          echo "BASE_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set image tag
        # Release branch (main): use the version in app/pyproject.toml to tag the image
        # Staging branch (staging): use the commit SHA to tag the image
        run: |  
          if [ "${GITHUB_REF_NAME}" = "a-zurcher" ]; then
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('app/pyproject.toml', 'rb'))['project']['version'])")
            echo "IMAGE_TAG=$VERSION" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "IMAGE_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if stable image already exists
        # Skipped on staging branch, as the git commit SHA is used to tag the image
        if: github.ref_name == 'a-zurcher'
        run: |
          TAG="${{ env.IMAGE_TAG }}"
          IMAGE="${{ env.BASE_IMAGE_NAME }}:$TAG"

          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists - stopping workflow"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build production target once and load it into the local Docker daemon.
      # This is the image that will be tested and pushed if all tests succeed.
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build the tooling target locally.
      # It shares the runtime base and dependencies with the production target and is used to run tests.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tooling
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.BASE_IMAGE_NAME }}-test:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        env:
          TEST_IMAGE: ${{ env.BASE_IMAGE_NAME }}-test
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          docker compose -f compose/test.yml run --rm web

      # Push only after tests pass.
      - name: Push staging image
        if: github.ref_name == 'staging' && success()
        run: |
          docker push "${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker tag \
            "${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.BASE_IMAGE_NAME }}:staging"
          docker push "${{ env.BASE_IMAGE_NAME }}:staging"

      - name: Push stable image
        if: github.ref_name == 'a-zurcher' && success()
        run: |
          docker push "${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker tag \
            "${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.BASE_IMAGE_NAME }}:stable"
          docker push "${{ env.BASE_IMAGE_NAME }}:stable"

      - name: Docker cleanup
        if: always()
        run: docker compose -f compose/test.yml down -v --remove-orphans || true