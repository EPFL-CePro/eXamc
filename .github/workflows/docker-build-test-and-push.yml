name: Build and Push Image to GHCR, with testing

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - staging
      - main

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

# Avoid two runs on the same branch racing to move :staging / :stable
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Compute the image tag and names once, and (on main) check whether the
  # versioned images already exist so later jobs can skip rebuilding them.
  # ---------------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      floating_tag: ${{ steps.tag.outputs.floating_tag }}
      django_image: ${{ steps.names.outputs.django_image }}
      fe_image: ${{ steps.names.outputs.fe_image }}
      skip_django: ${{ steps.check.outputs.skip_django }}
      skip_fe: ${{ steps.check.outputs.skip_fe }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image names
        id: names
        run: |
          BASE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "django_image=${BASE}-django" >> "$GITHUB_OUTPUT"
          echo "fe_image=${BASE}-fe-artifacts" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        # main:    version from django/app/pyproject.toml, promoted to :stable
        # staging: commit SHA, promoted to :staging
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('django/app/pyproject.toml', 'rb'))['project']['version'])")
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "floating_tag=stable" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "floating_tag=staging" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if versioned images already exist
        # Only relevant on main: staging tags are commit SHAs and always new
        id: check
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DJANGO_IMAGE: ${{ steps.names.outputs.django_image }}
          FE_IMAGE: ${{ steps.names.outputs.fe_image }}
        run: |
          exists() { docker manifest inspect "$1" >/dev/null 2>&1; }

          if [ "${GITHUB_REF_NAME}" = "main" ] && exists "${DJANGO_IMAGE}:${TAG}"; then
            echo "::warning::${DJANGO_IMAGE}:${TAG} already exists, skipping django build"
            echo "skip_django=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_django=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ] && exists "${FE_IMAGE}:${TAG}"; then
            echo "::warning::${FE_IMAGE}:${TAG} already exists, skipping fe-artifacts build"
            echo "skip_fe=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_fe=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build and push the frontend artifacts image under the immutable tag only.
  # The floating tag is moved later, in `promote`, once everything has passed.
  # ---------------------------------------------------------------------------
  fe-artifacts:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.meta.outputs.skip_fe != 'true'
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        if: needs.meta.outputs.skip_fe != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: needs.meta.outputs.skip_fe != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push fe-artifacts image
        if: needs.meta.outputs.skip_fe != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: artifact
          push: true
          platforms: linux/amd64
          tags: ${{ needs.meta.outputs.fe_image }}:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=fe-artifacts
          cache-to: type=gha,mode=max,scope=fe-artifacts

  # ---------------------------------------------------------------------------
  # Build the django production and test images, run the tests against the
  # fe-artifacts image from THIS commit/version, then push the production image.
  # ---------------------------------------------------------------------------
  django:
    needs: [meta, fe-artifacts]
    runs-on: ubuntu-latest
    if: needs.meta.outputs.skip_django != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the production image once and load it into the local daemon.
      # This exact image is pushed after the tests pass.
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: ./django
          target: production
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ needs.meta.outputs.django_image }}:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=django-production
          cache-to: type=gha,mode=max,scope=django-production

      # The test target shares the runtime base and dependencies with production.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: ./django
          target: tooling
          load: true
          platforms: linux/amd64
          tags: localhost/examc-django-test:latest
          cache-from: |
            type=gha,scope=django-test
            type=gha,scope=django-production
          cache-to: type=gha,mode=max,scope=django-test

      - name: Run tests
        env:
          TEST_IMAGE: localhost/examc-django-test
          IMAGE_TAG: latest
          FE_ARTIFACTS_IMAGE_TAG: ${{ needs.meta.outputs.tag }}
        run: docker compose -f compose/test-image.yml --env-file .env.test run --rm django

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: ./django
          target: production
          push: true
          platforms: linux/amd64
          tags: ${{ needs.meta.outputs.django_image }}:${{ needs.meta.outputs.tag }}
          cache-from: |
            type=gha,scope=django-production
            type=gha,scope=django-test
          cache-to: type=gha,mode=max,scope=django-production

  promote:
    needs: [meta, fe-artifacts, django]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.meta.result == 'success' &&
      needs.fe-artifacts.result == 'success' &&
      (needs.django.result == 'success' || needs.django.result == 'skipped')
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Retag images
        # imagetools retags in the registry directly, no pull needed
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          FLOATING: ${{ needs.meta.outputs.floating_tag }}
          DJANGO_IMAGE: ${{ needs.meta.outputs.django_image }}
          FE_IMAGE: ${{ needs.meta.outputs.fe_image }}
        run: |
          for IMAGE in "$DJANGO_IMAGE" "$FE_IMAGE"; do
            echo "Tagging ${IMAGE}:${TAG} as ${IMAGE}:${FLOATING}"
            docker buildx imagetools create -t "${IMAGE}:${FLOATING}" "${IMAGE}:${TAG}"
          done