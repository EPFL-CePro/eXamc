name: Security Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - staging
      - main

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: django/app

      - name: Run Security Checks
        run: bash django/security/security_check.sh