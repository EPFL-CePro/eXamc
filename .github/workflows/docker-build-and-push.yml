name: Build and Push Image to GHCR
on:
  workflow_call:
  push:
    branches:
      - a-zurcher
    # TODO: replace by on push tags when ready
    #tags:
    #  - "v**"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Set image name
        # Required to set an image name in lower-case only
        run: |
          echo "BASE_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('app/pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if container image already exists with current tag
        id: image_check
        run: |
          TAG="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.BASE_IMAGE_NAME }}:$TAG"
          
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists - stopping workflow"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BASE_IMAGE_NAME }}:latest
            ${{ env.BASE_IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max