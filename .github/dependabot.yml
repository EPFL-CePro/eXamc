version: 2
registries:
  # Docker Hardened Images: same Docker Hub account as CI
  dhi:
    type: docker-registry
    url: https://dhi.io
    username: ${{secrets.DHI_REGISTRY_USERNAME}}
    password: ${{secrets.DHI_REGISTRY_TOKEN}}
    replaces-base: false

updates:
  # Python dependencies: uv-managed project (django/app/pyproject.toml + django/app/uv.lock)
  # Security updates only: open-pull-requests-limit: 0 disables routine
  # version-update PRs, while security PRs are still opened.
  - package-ecosystem: "uv"
    directory: "/django/app"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    groups:
      python-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend JS dependencies (pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Base images in django/Dockerfile and frontend/Dockerfile
  - package-ecosystem: "docker"
    directories:
      - "/django"
      - "/frontend"
    registries:
      - dhi
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    ignore:
      # Stay in the current major version -> LTS changes must be done manually
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns:
          - "*"

  # Service images referenced in compose/compose.*.yml (mysql, redis, caddy)
  - package-ecosystem: "docker-compose"
    directory: "/compose"
    registries:
      - dhi
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      compose-images:
        patterns:
          - "*"

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
